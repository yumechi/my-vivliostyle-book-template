name: Build PDF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'manuscripts/**'
      - 'diagrams/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'vivliostyle.config.js'
      - '.textlintrc.json'
      - 'prh.yml'
  pull_request:
    branches: [main]
    paths:
      - 'manuscripts/**'
      - 'diagrams/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'vivliostyle.config.js'
      - '.textlintrc.json'
      - 'prh.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24.14.1'
          cache: 'pnpm'

      - name: Install Chromium dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            chromium-browser \
            fonts-noto-cjk \
            fonts-noto-cjk-extra

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run textlint
        id: textlint
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm run lint 2>&1 | tee /tmp/textlint-output.txt

      - name: Comment lint results on PR
        if: github.event_name == 'pull_request' && steps.textlint.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## textlint の指摘"
            echo ""
            echo '```'
            cat /tmp/textlint-output.txt
            echo '```'
          } > /tmp/comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/comment.md

      - name: Build PDF
        run: pnpm run build:ci
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser

      - name: Upload PDF artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # archive: false により zip 化せずに PDF をそのままアップロードする。
          # ブラウザから PDF を直接開けるようになる代わりに、
          # 単一ファイルしかアップロードできず、name は無視されて
          # ファイル名 (book.pdf) がそのままアーティファクト名になる。
          path: output/book.pdf
          archive: false
          retention-days: 1

      - name: Comment PDF link on PR
        if: github.event_name == 'pull_request'
        # fork からの PR ではトークンに書き込み権限がなくコメントできないが、
        # PDF のビルド自体は成功しているのでジョブは失敗させない
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          set -euo pipefail

          marker='<!-- build-pdf-artifact-link -->'
          {
            echo "$marker"
            echo "## ビルド済み PDF"
            echo ""
            echo "[book.pdf を開く]($ARTIFACT_URL) (${HEAD_SHA:0:7} 時点)"
            echo ""
            echo "GitHub にログインした状態であれば、ダウンロードせずブラウザ上でそのまま閲覧できます。"
            echo "保存期間は 1 日です。"
          } > /tmp/pdf-comment.md

          # push のたびにコメントが増えないよう、既存のコメントがあれば書き換える
          ids=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id")
          comment_id=$(printf '%s\n' "$ids" | head -n 1)

          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$comment_id" \
              -F body=@/tmp/pdf-comment.md
          else
            gh pr comment "$PR_NUMBER" --body-file /tmp/pdf-comment.md
          fi
