name: Build PDF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'manuscripts/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vivliostyle.config.js'
      - '.textlintrc.json'
      - 'prh.yml'
  pull_request:
    branches: [main]
    paths:
      - 'manuscripts/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vivliostyle.config.js'
      - '.textlintrc.json'
      - 'prh.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24.14.1'
          cache: 'pnpm'

      - name: Install Chromium dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            chromium-browser \
            fonts-noto-cjk \
            fonts-noto-cjk-extra

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run textlint
        id: textlint
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm run lint 2>&1 | tee /tmp/textlint-output.txt

      - name: Comment lint results on PR
        if: github.event_name == 'pull_request' && steps.textlint.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## textlint の指摘"
            echo ""
            echo '```'
            cat /tmp/textlint-output.txt
            echo '```'
          } > /tmp/comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/comment.md

      - name: Build PDF
        run: pnpm run build:ci
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser

      - name: Upload PDF artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: book-pdf
          path: output/book.pdf
          retention-days: 1
